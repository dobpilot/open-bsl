# Крейт НЕ входит в рабочее пространство open-bsl: у него своя цель
# (wasm32-wasip1) и своя внешняя зависимость, а правило «никаких новых
# внешних крейтов» относится к движку. Здесь — расширение редактора,
# движка оно не касается.
[package]
name = "open-bsl-zed-debug"
version = "0.2.1"
edition = "2024"
publish = false

# Собственное рабочее пространство: иначе cargo втягивает крейт в
# workspace open-bsl, где ему не место — другая цель сборки и внешняя
# зависимость, движка не касающаяся.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
