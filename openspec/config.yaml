schema: spec-driven

context: |
  open-bsl — Rust 2024 workspace с интерпретатором BSL.
  Наблюдаемая семантика 1С измеряется на реальной платформе; непроверенные
  решения отмечаются НЕ ИЗМЕРЕНО и регистрируются по правилам AGENTS.md.
  Публичные таблицы имён остаются единым источником для исполнения,
  компиляции, CLI и генерируемой документации.
  Новые внешние Rust-зависимости требуют предварительного решения.

rules:
  specs:
    - Описывать наблюдаемое поведение и проверяемые сценарии, а не устройство кода.
    - Для изменений совместимости указывать платформенный замер или маркер НЕ ИЗМЕРЕНО.
    - Каждый requirement должен содержать хотя бы один scenario.
  design:
    - Называть затронутые крейты и границы зависимостей.
    - Объяснять источник истины для имён, эффектов инструкций и форматов.
    - Не добавлять внешнюю зависимость без зафиксированного решения.
  tasks:
    - Начинать изменение поведения с теста или воспроизводимой проверки.
    - Завершать cargo fmt, clippy, workspace tests и rustdoc с -D warnings.
