# Выравнивание функций на 32 байта.
#
# Не микрооптимизация, а средство от МЕРЯЕМОСТИ. Добавление шимов в
# JIT-модуле однажды замедлило `str_find` на 45% — при том, что ни строкой
# кода поиск не менялся и `--jit` в том прогоне не участвовал. `perf stat`
# показал ровно одинаковое число инструкций (651M у обоих бинарников) и на
# 50% больше тактов: сместилась укладка кода, горячий цикл перестал попадать
# в границу. С этим флагом те же 66 мс возвращаются к 45.
#
# Без него любая правка где угодно может сдвинуть чужой бенчмарк на
# десятки процентов, и отличить настоящую регрессию от везения раскладки
# невозможно. Ради этого проект и меряет.
#
# Проверено на остальных сценариях: помогает (`table_sort` 1561 -> 1494) или
# ничего не меняет. Переменная окружения RUSTFLAGS это перекрывает —
# профилировать с `-C force-frame-pointers` по-прежнему можно.
[build]
rustflags = ["-C", "llvm-args=-align-all-functions=5"]

[alias]
# Переносимая VM и HTTP state machine без браузерного fetch-адаптера.
check-wasm = "check --target wasm32-unknown-unknown -p open-bsl --no-default-features --features http"
