[package]
name = "open-bsl"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["binbuf", "regexp", "textdoc", "json", "stream", "zip"]
binbuf = ["dep:bsl-binbuf", "bsl-vm/binbuf"]
stream = ["dep:bsl-stream", "binbuf", "bsl-vm/stream"]
json = ["dep:bsl-json", "bsl-vm/json"]
xml = []
pdf = []
zip = ["dep:bsl-zip", "bsl-vm/zip"]
spreadsheet = []
textdoc = ["dep:bsl-textdoc", "bsl-vm/textdoc"]
regexp = ["dep:bsl-regexp", "bsl-vm/regexp"]

[dependencies]
bsl-bytecode = { path = "../bsl-bytecode" }
bsl-rt = { path = "../bsl-rt" }
bsl-sema = { path = "../bsl-sema" }
bsl-syntax = { path = "../bsl-syntax" }
bsl-vm = { path = "../bsl-vm", default-features = false }
bsl-binbuf = { path = "../bsl-binbuf", optional = true }
bsl-regexp = { path = "../bsl-regexp", optional = true }
bsl-textdoc = { path = "../bsl-textdoc", optional = true }
bsl-json = { path = "../bsl-json", optional = true }
bsl-stream = { path = "../bsl-stream", optional = true }
bsl-zip = { path = "../bsl-zip", optional = true }
