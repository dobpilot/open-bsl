[package]
name = "open-bsl"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[features]
default = ["binbuf", "regexp", "textdoc", "json", "stream", "http", "crypto", "zip", "pdf", "xml", "spreadsheet"]
binbuf = ["dep:bsl-binbuf"]
stream = ["dep:bsl-stream", "binbuf"]
http = ["dep:bsl-http", "stream"]
crypto = ["dep:bsl-crypto"]
json = ["dep:bsl-json"]
xml = ["dep:bsl-xml"]
pdf = ["dep:bsl-pdf"]
zip = ["dep:bsl-zip"]
spreadsheet = ["dep:bsl-spreadsheet"]
textdoc = ["dep:bsl-textdoc"]
regexp = ["dep:bsl-regexp"]

[dependencies]
bsl-bytecode = { path = "../bsl-bytecode" }
bsl-compiler = { path = "../bsl-compiler" }
bsl-format = { path = "../bsl-format" }
bsl-rt = { path = "../bsl-rt" }
bsl-sema = { path = "../bsl-sema" }
bsl-syntax = { path = "../bsl-syntax" }
bsl-vm = { path = "../bsl-vm", default-features = false }
bsl-binbuf = { path = "../bsl-binbuf", optional = true }
bsl-regexp = { path = "../bsl-regexp", optional = true }
bsl-textdoc = { path = "../bsl-textdoc", optional = true }
bsl-json = { path = "../bsl-json", optional = true }
bsl-stream = { path = "../bsl-stream", optional = true }
bsl-http = { path = "../bsl-http", optional = true }
bsl-crypto = { path = "../bsl-crypto", optional = true }
bsl-zip = { path = "../bsl-zip", optional = true }
bsl-pdf = { path = "../bsl-pdf", optional = true }
bsl-xml = { path = "../bsl-xml", optional = true }
bsl-spreadsheet = { path = "../bsl-spreadsheet", optional = true }
