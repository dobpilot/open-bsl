[package]
name = "bsl-vm"
version.workspace = true
edition.workspace = true

[dependencies]
bsl-rt = { path = "../bsl-rt" }
bsl-bytecode = { path = "../bsl-bytecode" }
bsl-format = { path = "../bsl-format" }
bsl-number = { path = "../bsl-number" }
# ПРЯМЫХ зависимостей от `bsl-syntax` и `bsl-sema` здесь нет намеренно:
# `Выполнить`/`Вычислить` VM не компилирует, а спрашивает у хоста через
# `bsl_bytecode::DynamicCompiler`, и парсер с резолвером её код не зовёт.
#
# Транзитивно фронтенд в графе остаётся — через `bsl-bytecode`, чей
# `compile_program` принимает представление `bsl-sema`. Это ребро было тут
# и до выноса динамической компиляции наружу; убрать его можно только
# разделив `bsl-bytecode` на представление и компилятор, и это отдельная
# задача — со своей целью (облегчённая VM, встраивание без компиляции или
# сокращение графа), а не побочный эффект этой.

[dev-dependencies]
# Тестам канала обратного вызова (ПрочитатьJSON/ЗаписатьJSON зовут функции
# модуля по имени) нужен настоящий компонент; в обычные зависимости
# компонентные крейты больше не входят — VM говорит с ними через реестр.
bsl-json = { path = "../bsl-json" }
# Тесты и примеры собирают байт-код из исходника BSL, а тестовый компилятор
# фрагментов зовёт `bsl_bytecode::compile_dynamic_snippet`. В обычных
# зависимостях этих двух крейтов нет — см. выше.
bsl-sema = { path = "../bsl-sema" }
bsl-syntax = { path = "../bsl-syntax" }
pprof = { version = "0.13", default-features = false, features = ["flamegraph"] }
