[package]
name = "bsl-vm"
version = "0.2.1"
edition.workspace = true

[dependencies]
bsl-rt = { path = "../bsl-rt" }
bsl-bytecode = { path = "../bsl-bytecode" }
bsl-format = { path = "../bsl-format" }
bsl-number = { path = "../bsl-number" }
# Фронтенда в обычном графе VM нет ни прямо, ни транзитивно:
# `Выполнить`/`Вычислить` она не компилирует, а спрашивает у хоста через
# `bsl_bytecode::DynamicCompiler`, а сам `bsl-bytecode` после выделения
# `bsl-compiler` несёт только представление байт-кода и его текстовый
# формат. Проверяется это одной командой:
#
#     cargo tree -p bsl-vm -e normal
#
# `bsl-syntax` и `bsl-sema` в её выводе быть не должно.

[dev-dependencies]
# Тестам канала обратного вызова (ПрочитатьJSON/ЗаписатьJSON зовут функции
# модуля по имени) нужен настоящий компонент; в обычные зависимости
# компонентные крейты больше не входят — VM говорит с ними через реестр.
bsl-json = { path = "../bsl-json" }
# Тесты и примеры собирают байт-код из исходника BSL, а тестовый компилятор
# фрагментов зовёт `bsl_compiler::compile_dynamic_snippet`. В обычных
# зависимостях этих трёх крейтов нет — см. выше.
bsl-compiler = { path = "../bsl-compiler" }
bsl-sema = { path = "../bsl-sema" }
bsl-syntax = { path = "../bsl-syntax" }
pprof = { version = "0.13", default-features = false, features = ["flamegraph"] }

[features]
# Счётчики исполненных опкодов: см. модуль `counters` в lib.rs.
counters = []
