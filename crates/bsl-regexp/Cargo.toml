[package]
name = "bsl-regexp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bsl-number = { path = "../bsl-number" }
bsl-rt = { path = "../bsl-rt" }
# Матчинг делегирован fancy-regex: простые шаблоны идут в линейный NFA его
# нижнего слоя `regex`, просмотры и обратные ссылки — в его бэктрекер.
# Разбор диалекта и все измеренные края (якоря `REGEX.*`) остаются в
# `engine.rs`: рендерер печатает дерево развёрнутыми формами, а не
# передаёт шаблон крейту дословно. Собственный in-tree бэктрекер отставлен
# этим же решением — как раньше inflate/deflate/ZIP в пользу `flate2`/`zip`.
fancy-regex = "0.19"
