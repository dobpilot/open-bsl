[package]
name = "bsl-cli"
version = "0.2.1"
edition.workspace = true

[dependencies]
bsl-vm = { path = "../bsl-vm" }
open-bsl = { path = "../open-bsl" }
bsl-bytecode = { path = "../bsl-bytecode" }
bsl-compiler = { path = "../bsl-compiler" }
bsl-syntax = { path = "../bsl-syntax" }
bsl-sema = { path = "../bsl-sema" }
bsl-rt = { path = "../bsl-rt" }
bsl-format = { path = "../bsl-format" }
# Единственная внешняя зависимость всего рабочего пространства сверх
# num-bigint: сырой режим терминала, редактирование строки и история для
# REPL. Подсветку и дополнение реализуем сами через её трейты Highlighter и
# Completer — BSL-специфика остаётся нашей. `default-features = false`
# отсекает то, что нам не нужно (история в файле, дополнение путей).
rustyline = { version = "18", default-features = false }
# Сообщения Debug Adapter Protocol — это JSON. Вопрос о зависимости
# поднят до кода, как требует рабочий процесс, и альтернатива названа:
# свой кодек на 200–300 строк, потому что сообщения DAP малы и
# фиксированы по форме. Решение принято в пользу зависимости.
#
# `bsl-json` для этого не годится: его API — событийный читатель и
# `begin_object`-писатель под `BslValue`, то есть под BSL-поверхность
# формата, а не под служебные сообщения. Второй копией JSON это не
# является — `bsl-json` остаётся единственным JSON, доступным ИЗ BSL.
#
# Зависимость не выходит за `bsl-cli` тем же порядком, каким `reqwest` и
# `tokio` не выходят за `bsl-http`.
serde_json = "1"

[features]
counters = ["bsl-vm/counters"]
copyprop = ["bsl-compiler/copyprop", "open-bsl/copyprop"]
constprop = ["bsl-compiler/constprop", "open-bsl/constprop"]
