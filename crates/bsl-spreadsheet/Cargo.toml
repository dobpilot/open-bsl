[package]
name = "bsl-spreadsheet"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
bsl-rt = { path = "../bsl-rt" }
bsl-format = { path = "../bsl-format" }
bsl-pdf = { path = "../bsl-pdf" }
bsl-xml = { path = "../bsl-xml" }
# Контейнер XLSX собирает внешний `zip` — тот же крейт, что у архивов.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Тесты PDF-раскладки распаковывают контент-потоки, чтобы проверить байты.
flate2 = "1"
