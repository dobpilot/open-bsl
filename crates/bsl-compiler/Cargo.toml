[package]
name = "bsl-compiler"
version = "0.3.1"
edition.workspace = true

[dependencies]
bsl-bytecode = { path = "../bsl-bytecode" }
bsl-sema = { path = "../bsl-sema" }
bsl-syntax = { path = "../bsl-syntax" }
bsl-rt = { path = "../bsl-rt" }
bsl-number = { path = "../bsl-number" }

[features]
# Проход устранения копий (docs/research/performance/ssa-hotspot-analysis.md, шаг 6).
copyprop = []
# ЛОКАЛЬНОЕ (в пределах базового блока) распространение и свёртка
# констант. Шаг SSA-конвейера «распространение типов и констант» этим НЕ
# закрыт: нет переноса между блоками, meet, `Bottom`, φ, свёртки
# сравнений и удаления недостижимых ветвей.
constprop = []
