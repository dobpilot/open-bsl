# Крейт-потребитель, доказывающий ЗАМКНУТОСТЬ фасада: он зависит ТОЛЬКО от
# `open-bsl` и ни от одного внутреннего крейта (в первую очередь без
# `bsl-rt`). Если для того, чтобы написать свой компонент, сматчить ошибку
# по фазам или разобрать значение по видам, понадобится имя не из фасада,
# этот крейт перестанет собираться — и это и есть проверка (C.2).
[package]
name = "open-bsl-consumer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
open-bsl = { path = "../open-bsl" }
